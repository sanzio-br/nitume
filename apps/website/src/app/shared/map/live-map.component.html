<div
  class="nm-map"
  [class.nm-map--placeholder]="!showMap()"
  [style.height.px]="height()"
  [attr.role]="showMap() ? 'region' : 'img'"
  [attr.aria-label]="ariaLabel()"
>
  @if (showMap()) {
    <google-map
      class="nm-map__canvas"
      width="100%"
      height="100%"
      [options]="mapOptions"
      (mapInitialized)="onMapReady($event)"
      (authFailure)="onAuthFailure()"
    />
  }
  @if (etaLabel(); as eta) {
    <span class="nm-map__eta" nmNum>{{ eta }}</span>
  }
  <div class="nm-map__overlay"><ng-content select="[nmMapOverlay]" /></div>
</div>
