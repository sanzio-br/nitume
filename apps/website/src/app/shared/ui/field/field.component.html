<div class="nm-field">
  @if (label(); as text) {
    <label class="nm-field__label" [class.nm-field__label--hidden]="hideLabel()" [for]="id">{{ text }}</label>
  }
  <div class="nm-field__control">
    @if (kind() === 'multiline') {
      <textarea
        class="nm-field__input nm-field__input--multiline"
        [class.nm-field__input--error]="!!error()"
        [id]="id"
        [rows]="rows()"
        [value]="value()"
        [attr.placeholder]="placeholder()"
        [attr.maxlength]="maxLength()"
        [attr.autocomplete]="autocomplete()"
        [attr.autocapitalize]="autocapitalize()"
        [attr.spellcheck]="spellcheckAttr()"
        [disabled]="isDisabled()"
        [readOnly]="readonly()"
        [attr.aria-invalid]="error() ? 'true' : null"
        [attr.aria-describedby]="error() ? errorId : null"
        (input)="onInput($event)"
        (blur)="onTouched()"
      ></textarea>
    } @else {
      @if (kind() === 'money') {
        <span class="nm-field__prefix" nmNum>KSh </span>
      }
      @if (leadingIcon(); as icon) {
        <nm-icon class="nm-field__lead" [name]="icon" [size]="18" />
      }
      <input
        class="nm-field__input"
        [class.nm-field__input--num]="isNumeric()"
        [class.nm-field__input--money]="kind() === 'money'"
        [class.nm-field__input--lead]="!!leadingIcon()"
        [class.nm-field__input--busy]="busy()"
        [class.nm-field__input--error]="!!error()"
        [id]="id"
        [attr.type]="kind() === 'phone' ? 'tel' : 'text'"
        [attr.inputmode]="kind() === 'money' ? 'numeric' : kind() === 'phone' ? 'tel' : null"
        [attr.autocomplete]="kind() === 'phone' ? 'tel' : autocomplete()"
        [attr.autocapitalize]="autocapitalize()"
        [attr.spellcheck]="spellcheckAttr()"
        [value]="value()"
        [attr.placeholder]="placeholder()"
        [attr.maxlength]="maxLength()"
        [disabled]="isDisabled()"
        [readOnly]="readonly()"
        [attr.aria-invalid]="error() ? 'true' : null"
        [attr.aria-describedby]="error() ? errorId : null"
        [attr.role]="role()"
        [attr.aria-autocomplete]="ariaAutocomplete()"
        [attr.aria-expanded]="ariaExpandedAttr()"
        [attr.aria-controls]="ariaControls()"
        [attr.aria-activedescendant]="ariaActivedescendant()"
        [attr.aria-busy]="busy() ? 'true' : null"
        (input)="onInput($event)"
        (blur)="onTouched()"
      />
      @if (busy()) {
        <span class="nm-field__spinner" aria-hidden="true"></span>
      }
    }
  </div>
  @if (error(); as message) {
    <span class="nm-field__error" [id]="errorId" role="alert">{{ message }}</span>
  }
  @if (counter() && counterText(); as count) {
    <span class="nm-field__counter" nmNum="meta-lg">{{ count }}</span>
  }
</div>
