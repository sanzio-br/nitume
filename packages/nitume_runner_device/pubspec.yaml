name: nitume_runner_device
description: "Runner-only device plugins behind nitume_core abstractions: location (geolocator), photo capture (image_picker), permissions (permission_handler) and the offline queue store (shared_preferences) and the evidence folder (path_provider)."
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.13.4
  # 3.24: plugin `platforms:` and Swift Package Manager (ios/Package.swift).
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  nitume_core:
    path: ../nitume_core
  geolocator: ^14.0.2
  image_picker: ^1.2.4
  permission_handler: ^13.0.2
  shared_preferences: ^2.5.6
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  image_picker_platform_interface: ^2.11.2
  plugin_platform_interface: ^2.1.8
  shared_preferences_platform_interface: ^2.4.2
  path_provider_platform_interface: ^2.1.3

flutter:
  # iOS native side: excludes the offline evidence folder from backups
  # (NSURLIsExcludedFromBackupKey, owner row 255). Android needs no native
  # code here: the runner app's manifest backup rules exclude the folder.
  plugin:
    platforms:
      ios:
        pluginClass: NitumeRunnerDevicePlugin
