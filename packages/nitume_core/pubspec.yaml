name: nitume_core
description: "Shared Nitume core: design tokens, theme, shared widgets, API client, models, repositories and auth."
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.13.4
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.9.0
  flutter_secure_storage: ^9.2.4
  socket_io_client: ^3.1.6
  google_maps_flutter: ^2.18.2
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  url_launcher: ^6.3.3
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # Fira Sans (UI) and Fira Code (numeric data) are bundled so the apps render
  # the brand fonts offline on first launch. Both are SIL OFL 1.1; licence texts
  # live next to the files and are registered by NitumeFonts.registerLicenses().
  # Consumers reference them as `packages/nitume_core/<family>` (see
  # NitumeTypography); never by a bare family string.
  assets:
    - fonts/OFL-FiraSans.txt
    - fonts/OFL-FiraCode.txt
  fonts:
    - family: FiraSans
      fonts:
        - asset: fonts/FiraSans-Regular.ttf
          weight: 400
        - asset: fonts/FiraSans-Medium.ttf
          weight: 500
        - asset: fonts/FiraSans-SemiBold.ttf
          weight: 600
        - asset: fonts/FiraSans-Bold.ttf
          weight: 700
    - family: FiraCode
      fonts:
        - asset: fonts/FiraCode-Regular.ttf
          weight: 400
        - asset: fonts/FiraCode-Medium.ttf
          weight: 500
        - asset: fonts/FiraCode-SemiBold.ttf
          weight: 600
        - asset: fonts/FiraCode-Bold.ttf
          weight: 700
